
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vihara Tech | Profit Prediction</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff0e9, #ffffff);
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px #0002;
        }

        h1, .tagline, .badge {
            text-align: center;
        }

        h1 {
            color: #b00000;
            font-size: 36px;
        }

        h1 span, .form-title span {
            color: #ff4500;
        }

        .tagline {
            color: #777;
            margin: 8px 0 20px;
            font-size: 13px;
        }

        .badge {
            background: #fff0ea;
            color: #b00000;
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 25px;
            font-size: 12px;
        }

        .form-box {
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 25px;
        }

        .form-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: 1px solid #ff4500;
        }

        .predict-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #a80000, #ff4500);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .predict-btn:hover {
            opacity: 0.9;
        }

        .prediction {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, #a80000, #ff4500);
            color: white;
            text-align: center;
            border-radius: 12px;
        }

        .prediction-value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 20px;
            }

            h1 {
                font-size: 29px;
            }

            .form-box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="main-card">
        <h1>Profit prediction <span>Web</span></h1>



        <div class="badge">Multiple Linear Regression Project</div>

        <div class="form-box">
            <div class="form-title">
                Profit / Salary <span>Prediction System</span>
            </div>

            <form action="/predict" method="post">
                <div class="input-group">
                    <label for="rnd">R&D Spend</label>
                    <input type="number" id="rnd" name="rnd"
                           placeholder="Enter R&D spend" step="any" required>
                </div>

                <div class="input-group">
                    <label for="admin">Administration Spend</label>
                    <input type="number" id="admin" name="admin"
                           placeholder="Enter administration spend" step="any" required>
                </div>

                <div class="input-group">
                    <label for="marketing">Marketing Spend</label>
                    <input type="number" id="marketing" name="marketing"
                           placeholder="Enter marketing spend" step="any" required>
                </div>

                <div class="input-group">
                    <label for="state">State</label>
                    <select id="state" name="state" required>
                        <option value="" disabled selected>Select a state</option>
                        <option value="0">New York</option>
                        <option value="1">California</option>
                        <option value="2">Florida</option>
                    </select>
                </div>

                <button type="submit" class="predict-btn">
                    Predict Outcome
                </button>
            </form>
        </div>

        {% if prediction_text %}
        <div class="prediction">
            <div>Predicted Outcome</div>
            <div class="prediction-value">
                ₹ {{ prediction_text }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
